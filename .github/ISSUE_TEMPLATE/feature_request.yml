name: Feature request
description: 提议可验证且符合项目边界的改进
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户问题，不要只描述实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明可观察行为、最小范围和替代方案。
    validations:
      required: true

  - type: checkboxes
    id: contracts
    attributes:
      label: 可能影响的合同
      options:
        - label: 35D normal-only observation / 6D action
        - label: 关节顺序、方向、单位或 ros2_control 接口
        - label: ROS topic、参数或 launch 接口
        - label: 硬件安全边界
        - label: 均不影响

  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      description: 说明应执行的构建、运行时检查和人工验收。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 README 中的项目定位与当前支持范围。
          required: true
        - label: 我已搜索现有 issue，并确认没有相同建议。
          required: true
